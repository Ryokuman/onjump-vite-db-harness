services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: onjump_harness
      POSTGRES_USER: onjump
      POSTGRES_PASSWORD: onjump
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U onjump -d onjump_harness"]
      interval: 3s
      timeout: 3s
      retries: 20
